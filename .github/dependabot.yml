# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep Go modules, GitHub Actions, DevContainer images, Dockerfiles and the
#     funding script's npm packages updated with the latest security patches.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Tuesday 11:00 America/New_York) – align with typical maintenance windows.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected master branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI checks before merging.
#   • Cooldown – new releases wait 3 days before a version update PR
#     (gomod: patch 3 / minor 7 / major 14 days); first‑party and trusted
#     publishers are exempt, and security updates are never delayed.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
      exclude: ["github.com/bsv-blockchain/*"]

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude: ["actions/*", "github/*", "gitleaks/*", "ossf/*"]

  # ──────────────────────────────────────────────────────────────
  # 3. DevContainer (devcontainer.json : base image + features)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:30"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      devcontainer-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "devcontainer"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude: ["ghcr.io/devcontainers/features/*"]

  # ──────────────────────────────────────────────────────────────
  # 4. Dockerfiles (any Dockerfile in repo root or sub‑dirs)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:45"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      dockerfiles-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3

  # ──────────────────────────────────────────────────────────────
  # 5. npm (initial funding script: package.json / package-lock.json)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "12:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      npm-all:
        patterns: ["*"]
        # Batch only minor/patch; major bumps open as individual PRs for review
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "npm"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
      exclude: ["@bsv/*"]
